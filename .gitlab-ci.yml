stages:
  - test
  - publish

test:
  stage: test
  tags:
    - build
  before_script:
    - export PATH="$HOME/.local/node-v22.14.0/bin:$PATH"
    - npm ci
  script:
    - npm run lint
    # coverage-check runs every suite under coverage and fails when a
    # workspace drops below the floor in its own vitest config. It replaces
    # a bare `npm test` because a green suite says nothing about how much
    # of the code it ran — these thresholds sat at 5% functions for months
    # while apps/web climbed to seventy, and nothing noticed either way.
    - make quality-gate

publish:
  stage: publish
  tags:
    - build
  only:
    - tags
  before_script:
    - export PATH="$HOME/.local/node-v22.14.0/bin:$PATH"
    - echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
    - npm ci
  script:
    - export VERSION=$(echo "$CI_COMMIT_TAG" | sed 's/^v//')
    - echo "Publishing version $VERSION"
    - |
      for pkg in packages/core packages/schema packages/router packages/ui; do
        cd "$CI_PROJECT_DIR/$pkg"
        npm version "$VERSION" --no-git-tag-version --allow-same-version
      done
    - cd "$CI_PROJECT_DIR/packages/router" && npm run build
    - |
      for pkg in packages/core packages/schema packages/router packages/ui; do
        cd "$CI_PROJECT_DIR/$pkg"
        echo "Publishing $(node -p 'require("./package.json").name')@$VERSION"
        npm publish --access public || echo "Already published or failed: $pkg"
      done
    # The loop above tolerates a re-run over an already-published version,
    # which is right; it also tolerated a dead NPM_TOKEN, which is not —
    # v1.2.0, v1.3.1 and v1.3.3 all went "Passed" with four 404s in the log
    # and nothing on npm (2026-09-15). The registry is the only witness that
    # matters, so ask it: every package must answer at this version or the
    # job fails, whatever the loop printed. npm answers a publish with "being
    # processed and may take a few minutes to become available" and means
    # it — v1.3.4 published fine and was invisible for ~100 s — so ask
    # again, up to five minutes, before calling one missing.
    - |
      for pkg in packages/core packages/schema packages/router packages/ui; do
        name=$(node -p "require('$CI_PROJECT_DIR/$pkg/package.json').name")
        for attempt in $(seq 1 20); do
          if [ "$(npm view "$name@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
            echo "on npm: $name@$VERSION"; continue 2
          fi
          sleep 15
        done
        echo "NOT on npm after 5 minutes: $name@$VERSION"; exit 1
      done
