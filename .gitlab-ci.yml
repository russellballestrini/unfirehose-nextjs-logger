stages:
  - test
  - publish

# Node comes from nodejs.org, pinned by sha256 and installed on first use, so
# a fresh `build` runner provisions itself and a tampered tarball fails the
# job. NODE_SHA256 is the linux-x64 .tar.gz line of SHASUMS256.txt for this
# release, whose detached signature verifies against a releaser key listed in
# nodejs/node README (Antoine du Hamel, 5BE8A3F6C8A5C01D106C0AD820B1A390B168D356).
# 22.23.4 carries the eMudhra distrust in its compiled-in root store
# (Oct 2026). Bump version and hash together.
.install_node: &install_node |
  NODE_VERSION="22.23.4"
  NODE_SHA256="b8492284c76a54baf58d61668dd0e41ee0fc98adabf9503d30f05d08f55b4406"
  NODE_INSTALL_DIR="$HOME/.local/node-v${NODE_VERSION}"
  NODE_TARBALL="$HOME/node-v${NODE_VERSION}-linux-x64.tar.gz"
  if [ ! -x "$NODE_INSTALL_DIR/bin/node" ]; then
    echo "Installing Node ${NODE_VERSION}..."
    if [ ! -f "$NODE_TARBALL" ] || ! echo "${NODE_SHA256}  ${NODE_TARBALL}" | sha256sum -c - >/dev/null 2>&1; then
      rm -f "$NODE_TARBALL"
      wget -q "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64.tar.gz" -O "$NODE_TARBALL"
    fi
    echo "${NODE_SHA256}  ${NODE_TARBALL}" | sha256sum -c - || { echo "NODE CHECKSUM FAIL"; exit 1; }
    rm -rf "$NODE_INSTALL_DIR"
    mkdir -p "$NODE_INSTALL_DIR"
    tar -xzf "$NODE_TARBALL" -C "$NODE_INSTALL_DIR" --strip-components=1
  fi
  export PATH="$NODE_INSTALL_DIR/bin:$PATH"
  node --version

test:
  stage: test
  tags:
    - build
  before_script:
    - *install_node
    - npm ci
  script:
    - npm run lint
    - make typecheck
    # coverage-check runs every suite under coverage and fails when a
    # workspace drops below the floor in its own vitest config. It replaces
    # a bare `npm test` because a green suite says nothing about how much
    # of the code it ran — these thresholds sat at 5% functions for months
    # while apps/web climbed to seventy, and nothing noticed either way.
    - make quality-gate
    # packages/schema has no coverage (its source is JSON), so the gate
    # above never runs it: the conformance suite runs on its own.
    - make test-schema

publish:
  stage: publish
  tags:
    - build
  only:
    - tags
  before_script:
    - *install_node
    - echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
    - npm ci
  script:
    - export VERSION=$(echo "$CI_COMMIT_TAG" | sed 's/^v//')
    - echo "Publishing version $VERSION"
    - |
      for pkg in packages/core packages/schema packages/router packages/ui; do
        cd "$CI_PROJECT_DIR/$pkg"
        npm version "$VERSION" --no-git-tag-version --allow-same-version
      done
    - cd "$CI_PROJECT_DIR/packages/router" && npm run build
    - |
      for pkg in packages/core packages/schema packages/router packages/ui; do
        cd "$CI_PROJECT_DIR/$pkg"
        echo "Publishing $(node -p 'require("./package.json").name')@$VERSION"
        npm publish --access public || echo "Already published or failed: $pkg"
      done
    # The loop above tolerates a re-run over an already-published version,
    # which is right; it also tolerated a dead NPM_TOKEN, which is not —
    # v1.2.0, v1.3.1 and v1.3.3 all went "Passed" with four 404s in the log
    # and nothing on npm (2026-09-15). The registry is the only witness that
    # matters, so ask it: every package must answer at this version or the
    # job fails, whatever the loop printed. npm answers a publish with "being
    # processed and may take a few minutes to become available" and means
    # it — v1.3.4 published fine and was invisible for ~100 s — so ask
    # again, up to five minutes, before calling one missing.
    - |
      for pkg in packages/core packages/schema packages/router packages/ui; do
        name=$(node -p "require('$CI_PROJECT_DIR/$pkg/package.json').name")
        for attempt in $(seq 1 20); do
          if [ "$(npm view "$name@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
            echo "on npm: $name@$VERSION"; continue 2
          fi
          sleep 15
        done
        echo "NOT on npm after 5 minutes: $name@$VERSION"; exit 1
      done
